  url: https://consultar.io/api/v1/cpf/consultar?cpf=87135740009&data_nascimento=1990-01-01
  params:
    - name: cpf
      value: "87135740009"
      type: query
    - name: data_nascimento
      value: 1990-01-01
      type: query
  auth: inherit

settings:
