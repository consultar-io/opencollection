info:
  name: Consultar CRBM
  type: http
  seq: 1

http:
  method: GET
  url: https://consultar.io/api/v1/crbm/consultar?regiao=01&numero_registro=1234567
  params:
    - name: regiao
      value: "01"
      type: query
    - name: numero_registro
      value: "1234567"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

